<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BigDimension</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">BigDimension</div>
      <nav class="nav" aria-label="Navegação principal">
        <a href="#science">Science</a>
        <a href="#proteins">Proteins</a>
        <a href="#about">About</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="protein-grid" aria-label="Estruturas protéicas">
        <article class="protein-card blue" aria-label="Proteína azul">
          <canvas></canvas>
          <div class="drag-indicator" aria-hidden="true"></div>
        </article>

        <article class="protein-card purple" aria-label="Proteína roxa">
          <canvas></canvas>
          <div class="drag-indicator" aria-hidden="true"></div>
        </article>

        <article class="protein-card green" aria-label="Proteína verde">
          <canvas></canvas>
          <div class="drag-indicator" aria-hidden="true"></div>
        </article>
      </section>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
