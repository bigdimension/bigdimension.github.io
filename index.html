<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Dimension</title>

    <meta name="description" content="Big Dimension: An independent research studio engineering responsive, agent-based systems anchored in real molecular geometry and digital biochemistry.">
    <meta name="keywords" content="AI research, molecular geometry, agent-based systems, biochemistry, computational physics">

    <meta property="og:title" content="Big Dimension - AI Research Studio">
    <meta property="og:description" content="An independent research studio engineering a new class of responsive, agent-based systems and digital biochemistry.">
    <meta property="og:image" content="https://bigdimension.github.io/WhatsApp Image 2026-08-10 at 13.05.44.jpeg">
    <meta property="og:url" content="https://bigdimension.github.io">
    <meta property="og:type" content="website">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Big Dimension",
      "description": "An independent research studio engineering responsive, agent-based systems anchored in real molecular geometry.",
      "url": "https://bigdimension.github.io",
      "logo": "https://bigdimension.github.io/favicon.png"
    }
    </script>

    <link rel="icon" href="/favicon.png" type="image/png">

    <style>
        :root {
            --bg: #ffffff;
            --panel: #f9f9f7;
            --text: #111111;
            --muted: #5d5d5d;
            --line: #efefef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(17,17,17,0.04);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            display: block;
        }

        .brand-name {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.06em;
            color: var(--text);
        }

        main {
            flex: 1;
            width: 100%;
        }

        .blank-stage {
            width: 100%;
            min-height: 36vh;
            background: #ffffff;
        }

        .quote-section {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 28px 28px 40px;
            border-top: 1px solid var(--line);
        }

        .quote-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }

        blockquote {
            background: var(--panel);
            border: 1px solid rgba(17,17,17,0.03);
            border-radius: 16px;
            padding: 20px 18px;
            color: var(--text);
            font-size: 0.95rem;
            line-height: 1.7;
            font-weight: 500;
            font-style: italic;
            letter-spacing: -0.02em;
        }

        @media (max-width: 640px) {
            .header-inner,
            .quote-section {
                padding-left: 18px;
                padding-right: 18px;
            }

            .brand-name {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="brand" aria-label="Big Dimension logo and name">
                <img src="WhatsApp Image 2026-08-10 at 13.05.44.jpeg" alt="Big Dimension logo">
                <span class="brand-name">Big Dimension</span>
            </div>
        </div>
    </header>

    <main>
        <div class="blank-stage" aria-hidden="true"></div>
    </main>

    <section class="quote-section" aria-label="Quotes">
        <div class="quote-grid">
            <blockquote>“Research begins where computation meets structure, signal, and meaning.”</blockquote>
            <blockquote>“The future of intelligence is not abstract alone—it is embodied, responsive, and measurable.”</blockquote>
            <blockquote>“We build systems that remain legible to the geometry of the real world.”</blockquote>
        </div>
    </section>
</body>
</html>
